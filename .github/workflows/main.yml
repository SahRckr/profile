on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          
      - name: deploy
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898583+github-actions[bot]@users.noreply.github.com"
          npm ci
          npm run send
